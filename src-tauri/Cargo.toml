[package]
name = "servos"
version = "0.1.0-rc.1"
description = "Servos en la computadora: para traducir en su idioma, en equipo, con o sin internet"
authors = ["Idiomas Puentes"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the library's name apart from the program's (cargo on Windows, rust-lang/cargo#8519).
name = "servos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"

# A smaller program: the installer travels on memory cards and by Bluetooth.
[profile.release]
lto = true
opt-level = "s"
strip = true
